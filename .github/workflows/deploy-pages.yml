name: Deploy aINVEST to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Refresh SEC Form 4, FINRA Short Volume, SEC FTD & Congress data every 4h on weekdays + Saturday catch-up
    - cron: '15 13,17,21,1 * * 1-5'
    - cron: '15 14 * * 6'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync official SEC Form 4, FINRA Short Vol, SEC FTD & Congress data
        run: node scripts/sync-insiders-data.mjs

      - name: Sync CBOE Options Flow & Dealer GEX Confluence snapshot
        run: node scripts/sync-confluence-data.mjs

      - name: Build production bundle
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
